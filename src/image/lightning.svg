<svg viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Realistic dark lightning bolt, top-left to mid-frame</title>
<defs>
    <filter id="glow-strong" x="-150%" y="-150%" width="400%" height="400%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b1" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2" />
        <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <filter id="glow-soft" x="-150%" y="-150%" width="400%" height="400%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1" />
        <feMerge>
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
</defs>

<style>
    .main-strike {
        fill: none;
        stroke: #f3ecff;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#glow-strong);
        stroke-dasharray: 2600;
        stroke-dashoffset: 2600;
        opacity: 0;
        animation: strikeGrow 0.6s cubic-bezier(.1,.8,.15,1) forwards,
                   strikeFlicker 1.3s steps(1) 0.6s forwards;
    }
    .branch-1 {
        fill: none;
        stroke: #e4d6ff;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#glow-soft);
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        opacity: 0;
        animation: branchGrow 0.4s ease-out forwards,
                   branchFlicker 1.3s steps(1) 0.45s forwards;
    }
    .branch-2 {
        fill: none;
        stroke: #d7c4ff;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#glow-soft);
        stroke-dasharray: 250;
        stroke-dashoffset: 250;
        opacity: 0;
        animation: branchGrow 0.3s ease-out forwards,
                   branchFlicker 1.3s steps(1) 0.35s forwards;
    }
    @keyframes strikeGrow {
        0% { stroke-dashoffset: 2600; opacity: 0; }
        3% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes strikeFlicker {
        0% { opacity: 1; }
        9% { opacity: .12; }
        15% { opacity: 1; }
        22% { opacity: .08; }
        30% { opacity: .8; }
        40% { opacity: .15; }
        47% { opacity: 1; }
        60% { opacity: .05; }
        68% { opacity: .5; }
        80% { opacity: .05; }
        100% { opacity: 0; }
    }
    @keyframes branchGrow {
        0% { stroke-dashoffset: 400; opacity: 0; }
        20% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: .9; }
    }
    @keyframes branchFlicker {
        0% { opacity: .9; }
        10% { opacity: .1; }
        18% { opacity: .85; }
        26% { opacity: .05; }
        35% { opacity: .7; }
        48% { opacity: .1; }
        55% { opacity: .8; }
        70% { opacity: .05; }
        100% { opacity: 0; }
    }
</style>




